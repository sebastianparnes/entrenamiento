name: App Android

on:
  push:
    branches: [main]
    paths: ['public/**', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Firma: si el repo tiene los secrets ANDROID_KEYSTORE_B64 y ANDROID_KEYSTORE_PASSWORD
      # se usa siempre la misma clave (las actualizaciones se instalan encima).
      # Si no, se genera una clave temporal para esta corrida.
      - name: Preparar firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/pedal-ba.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
            echo "SIGNING=estable" >> "$GITHUB_ENV"
          else
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS" -alias pedalba -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Pedal BA, C=AR"
            echo "SIGNING=temporal" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$PASS"
          {
            echo "ANDROID_KEYSTORE_PATH=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=pedalba"
          } >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: mobile
        run: |
          set -o pipefail
          {
            npm ci
            npm run sync
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          } 2>&1 | tee build.log
          cp android/app/build/outputs/apk/release/app-release.apk pedal-ba.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Pedal BA para Android (versión ${{ github.run_number }})
          body: |
            Instalá `pedal-ba.apk` en el celular.
            Firma: ${{ env.SIGNING }}.
          files: mobile/pedal-ba.apk
          make_latest: true

      - name: Guardar log si falla
        if: failure()
        run: |
          cp mobile/build.log /tmp/build.log 2>/dev/null || echo "sin log de compilación" > /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf -q . || true
          tail -c 200000 /tmp/build.log > build-tail.log
          git add build-tail.log
          git commit -q -m "Log de la corrida ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs
