<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedal BA — nueva versión</title>
<meta name="theme-color" content="#0b0d10">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d10;color:#eef1f4;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;box-sizing:border-box}
  .c{max-width:420px;width:100%}
  h1{font-size:26px;margin:0 0 8px} p{color:#a3abb4}
  a.b{display:block;text-align:center;padding:16px;border-radius:14px;background:#c6f432;color:#13170a;font-weight:800;text-decoration:none;margin:12px 0}
  a.s{display:block;text-align:center;padding:14px;border-radius:14px;border:1px solid #2a3038;color:#eef1f4;text-decoration:none}
  small{color:#6b737c}
</style>
</head>
<body>
<div class="c">
  <div style="color:#c6f432;font-weight:900;letter-spacing:.05em;font-size:13px">PEDAL BA</div>
  <h1>El Training Log se mudó</h1>
  <p id="msg">La app nueva tiene rutas en bici, GPS, historial y para compartir tus recorridos.</p>
  <a class="b" id="go" href="__APP_URL__/">Abrir Pedal BA</a>
  <a class="s" href="./legacy/">Abrir la app vieja</a>
  <p><small>Instalala desde la app nueva con “Agregar a pantalla de inicio”.</small></p>
</div>
<script>
  const APP = '__APP_URL__';
  try {
    const raw = localStorage.getItem('training-data-v1');
    const data = raw ? JSON.parse(raw) : [];
    if (Array.isArray(data) && data.length) {
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      document.getElementById('msg').textContent = `Tenés ${data.length} sesiones guardadas en este celular. Tocá el botón y se pasan solas a la app nueva.`;
      const a = document.getElementById('go');
      a.textContent = `Pasar ${data.length} sesiones a Pedal BA`;
      a.href = `${APP}/#legacy=${b64}`;
    }
  } catch (e) {}
</script>
</body>
</html>
